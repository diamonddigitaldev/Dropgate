name: Client build

# The desktop app's build on one platform, as CI and the release workflow run
# it: the packages from the config in client/electron-builder.cjs, listed and
# checked. Nothing is published, and nothing is uploaded as a workflow artifact:
# on a public repository, anyone signed in could download it.
#
# For a release, it also lists the files the release would attach from this
# platform, and hands its update file on to the release's last job. A published
# release's own copy of the job attaches them, straight from this build.

on:
  workflow_call:
    inputs:
      os:
        description: The runner, windows-latest or ubuntu-latest.
        type: string
        required: true
      release:
        description: Whether to list the files a release would attach.
        type: boolean
        default: false
      prerelease:
        description: Whether that release is a pre-release, "true" or "false". It attaches the same files, update file included.
        type: string
        default: 'false'
      attach-to:
        description: A published release's tag, to attach the files to. Empty, as in CI and the dry run, attaches nothing.
        type: string
        default: ''
    outputs:
      update-file-name:
        description: The update file every release attaches, latest.yml or latest-linux.yml.
        value: ${{ jobs.build.outputs.update-file-name }}
      update-file:
        description: Its contents, in base64.
        value: ${{ jobs.build.outputs.update-file }}

# No permissions of its own: a called workflow can only lower its caller's.
# CI and the release's dry run call it with a read-only token, and a published
# release with one that can attach files.

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    outputs:
      update-file-name: ${{ steps.release.outputs.update-file-name }}
      update-file: ${{ steps.release.outputs.update-file }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          npm --version
          npm ci

      # The .rpm target needs rpmbuild, from the rpm package. The Ubuntu image
      # ships it today, so this only installs it if a later image drops it.
      - name: Check for rpmbuild
        if: runner.os == 'Linux'
        run: |
          if ! command -v rpmbuild > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends rpm
          fi
          rpmbuild --version

      # Builds this platform's targets from electron-builder.cjs (the kit's config()).
      # Nothing is published, and no token is passed to it.
      - name: Build the packages
        run: npx --no-install electron-builder ${{ runner.os == 'Windows' && '--win' || '--linux' }} --publish never

      - name: List the built files
        shell: bash
        run: |
          for f in dist/*; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%-45s %11d bytes  %s\n' "${f#dist/}" "$size" \
              "$(numfmt --to=iec-i --suffix=B --format=%.1f "$size")"
          done
          for ext in ${{ runner.os == 'Windows' && 'exe' || 'AppImage deb rpm' }}; do
            ls dist/*."$ext" > /dev/null || { echo "No .$ext package was built"; exit 1; }
          done

      - name: Show the .deb and .rpm metadata
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/*.deb
          rpm -qip dist/*.rpm

      # The kit's config() writes the .desktop file: Dropgate is in Open With
      # for any file (application/octet-stream), gets every file it's opened
      # with (%F), and its window matches the entry (desktopName, StartupWMClass).
      - name: Check the .desktop file in the .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          name=com.diamonddigitaldev.dropgateclient
          entry=usr/share/applications/$name.desktop
          rpm -qlp dist/*.rpm | grep -x "/$entry"
          dir=$(mktemp -d)
          dpkg-deb -x dist/*.deb "$dir"
          cat "$dir/$entry"
          grep -x "MimeType=application/octet-stream;" "$dir/$entry"
          grep -E '^Exec=.* %F$' "$dir/$entry"
          grep -x "StartupWMClass=$name" "$dir/$entry"
          grep -x "Categories=Network;" "$dir/$entry"
          node -e '
            const asar = require("@electron/asar");
            const pkg = JSON.parse(asar.extractFile(process.argv[1], "package.json").toString());
            if (pkg.desktopName !== process.argv[2] + ".desktop") { console.log(`::error::The packed package.json has desktopName ${pkg.desktopName}.`); process.exit(1); }
          ' "$dir/opt/Dropgate Client/resources/app.asar" "$name"
          echo "The .desktop file and desktopName match the appId."

      # electron-builder.cjs's files is an allowlist: the app's own src/, and only
      # the files of the kit, Bootstrap and Material Icons the pages load (the
      # other packages are what electron-store and electron-updater need). This
      # lists what the packaged app holds outside node_modules, and those three
      # packages' files, and fails on anything else of theirs.
      - name: Check the packaged app
        shell: bash
        run: |
          list="$RUNNER_TEMP/app-asar.txt"
          npx --no-install asar list dist/*-unpacked/resources/app.asar | tr '\\' '/' > "$list"
          echo "app.asar holds $(wc -l < "$list") entries. Outside node_modules:"
          grep -v '^/node_modules/' "$list"
          echo
          echo "The kit's, Bootstrap's and Material Icons' files:"
          grep -E '^/node_modules/(@diamonddigitaldev|bootstrap|material-icons)(/|$)' "$list"
          # What the allowlist keeps of the app and of those three packages.
          own='^/(node_modules|src|package\.json)(/|$)'
          kit='^/node_modules/@diamonddigitaldev(/electron-kit(/(LICENSE|package\.json|preload\.js|(main|page|css|format)(/.*)?))?)?$'
          bootstrap='^/node_modules/bootstrap(/(LICENSE|package\.json|dist(/css(/bootstrap\.min\.css)?)?))?$'
          icons='^/node_modules/material-icons(/(LICENSE|package\.json|iconfont(/(round\.css|material-icons-round\.woff2?))?))?$'
          unexpected=$( (grep -vE "$own" "$list"; grep -E '^/node_modules/(@diamonddigitaldev|bootstrap|material-icons)(/|$)' "$list" | grep -vE "$kit|$bootstrap|$icons") || true)
          if [ -n "$unexpected" ]; then
            echo
            echo "Outside the allowlist in client/electron-builder.cjs:"
            echo "$unexpected"
            exit 1
          fi

      # The app loads core's build from src/dropgate-core.js, which the core job
      # checks against core's source. This checks the package carries it as is.
      - name: Check the packaged app carries core's build
        shell: bash
        run: |
          node -e '
            const { extractFile } = require("@electron/asar");
            const fs = require("fs");
            const packaged = extractFile(process.argv[1], "src/dropgate-core.js");
            if (!packaged.equals(fs.readFileSync("src/dropgate-core.js"))) {
              console.error("The packaged src/dropgate-core.js is not the one in client/src.");
              process.exit(1);
            }
            console.log("The packaged app carries client/src/dropgate-core.js as it is.");
          ' dist/*-unpacked/resources/app.asar

      # Every file a release would attach from this platform, in order, and the
      # update file, which must name only those files, with their sizes and
      # hashes. It goes up last, in the release's last job.
      - name: List the release's files
        id: release
        if: inputs.release
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: node ../.github/scripts/desktop-release-files.mjs dist --prerelease "$PRERELEASE"

      # A published release attaches those files, from the build that made
      # them. Its update file goes up later, after every other file.
      - name: Attach the files to the release
        if: inputs.release && inputs.attach-to != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.attach-to }}
          FILES: ${{ steps.release.outputs.attach }}
        run: |
          files=()
          for name in $FILES; do files+=("dist/$name"); done
          bash ../.github/scripts/attach-release-files.sh "$TAG" "${files[@]}"
