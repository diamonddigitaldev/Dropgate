name: CI

on:
  push:
    branches: ['4.0.0']
  pull_request:
    branches: ['4.0.0']
  # The release workflow runs all of this before it releases anything.
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Core, the server and the client are released together from one tag, so
      # each one's package.json, package-lock.json and README badge must give the
      # same version. Nothing to install.
      - name: Check the versions match
        run: node .github/scripts/check-versions.mjs

  server:
    name: Server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # The expected-failure tests use node:test's expectFailure, added in 24.14.
          node-version: '^24.14'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          npm --version
          npm ci

      # The same run as `npm test`, with the TAP reporter so each expected failure's
      # label shows in the log. The reporter has to come before the pattern, which
      # `npm test -- --test-reporter=tap` can't do.
      - name: Run tests
        run: node --test --test-reporter=tap "test/*.test.mjs"

  client:
    name: Client tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # The expected-failure tests use node:test's expectFailure, added in 24.14.
          node-version: '^24.14'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      # Electron downloads its binary the first time it runs, not on install, and
      # these tests only read the source, so nothing large is downloaded here.
      - name: Install dependencies
        run: |
          npm --version
          npm ci

      # The same run as `npm test`, with the TAP reporter so each expected failure's
      # label shows in the log.
      - name: Run tests
        run: node --test --test-reporter=tap "test/*.test.mjs"

  client-build:
    name: Client build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            packages: exe
          - os: ubuntu-latest
            platform: --linux
            packages: AppImage deb rpm
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          npm --version
          npm ci

      # The .rpm target needs rpmbuild, from the rpm package. The Ubuntu image
      # ships it today, so this only installs it if a later image drops it.
      - name: Check for rpmbuild
        if: runner.os == 'Linux'
        run: |
          if ! command -v rpmbuild > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends rpm
          fi
          rpmbuild --version

      # Builds this platform's targets from the "build" config in package.json.
      # Nothing is published, and no token is passed to it.
      - name: Build the packages
        run: npx --no-install electron-builder ${{ matrix.platform }} --publish never

      - name: List the built files
        shell: bash
        run: |
          for f in dist/*; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%-45s %11d bytes  %s\n' "${f#dist/}" "$size" \
              "$(numfmt --to=iec-i --suffix=B --format=%.1f "$size")"
          done
          for ext in ${{ matrix.packages }}; do
            ls dist/*."$ext" > /dev/null || { echo "No .$ext package was built"; exit 1; }
          done

      - name: Show the .deb and .rpm metadata
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/*.deb
          rpm -qip dist/*.rpm

      # package.json leaves client/test/ out of the app. This lists what the
      # packaged app holds outside node_modules, and fails if test/ is back in.
      - name: Check the packaged app
        shell: bash
        run: |
          list=$(npx --no-install asar list dist/*-unpacked/resources/app.asar | tr '\\' '/')
          echo "app.asar holds $(printf '%s\n' "$list" | wc -l) entries. Outside node_modules:"
          printf '%s\n' "$list" | grep -v '^/node_modules/'
          if printf '%s\n' "$list" | grep -q '^/test\(/\|$\)'; then
            echo "client/test/ is in the package"
            exit 1
          fi

      # The app loads core's build from src/dropgate-core.js, which the core job
      # checks against core's source. This checks the package carries it as is.
      - name: Check the packaged app carries core's build
        shell: bash
        run: |
          node -e '
            const { extractFile } = require("@electron/asar");
            const fs = require("fs");
            const packaged = extractFile(process.argv[1], "src/dropgate-core.js");
            if (!packaged.equals(fs.readFileSync("src/dropgate-core.js"))) {
              console.error("The packaged src/dropgate-core.js is not the one in client/src.");
              process.exit(1);
            }
            console.log("The packaged app carries client/src/dropgate-core.js as it is.");
          ' dist/*-unpacked/resources/app.asar

  core:
    name: Core typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/dropgate-core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/dropgate-core/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        run: |
          npm --version
          npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The build also writes core's copies in the server and the client
      # (scripts/copy-build.mjs). If that changed anything, a copy was edited by
      # hand, or not built again after a change to core.
      - name: Check the server's and client's copies of the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "The build changed the files above. Run npm run build in packages/dropgate-core and commit them."
            exit 1
          fi
          echo "The server's and client's copies are this build."

      # The verbose reporter lists every test, so each expected failure's name,
      # which says what fixes it, shows in the log.
      - name: Run tests
        run: npx vitest run --reporter=verbose

  integration:
    name: Integration tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            tests/integration/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Each test starts the real server from server/, so it needs its dependencies.
      - name: Install the server's dependencies
        working-directory: server
        run: |
          npm --version
          npm ci

      - name: Install dependencies
        run: |
          npm ci
          npx playwright --version

      # Only the browsers the tests use, plus the system libraries they need. The
      # tests run headless, so Chromium's headless shell is enough.
      - name: Install browsers
        run: npx playwright install --with-deps --only-shell chromium firefox webkit

      # The list reporter prints every test's name, browser and result. Every test
      # talks only to its own server on 127.0.0.1. The desktop app's tests run in
      # their own job, below.
      - name: Run tests
        run: npx playwright test --project=chromium --project=firefox --project=webkit

  desktop:
    name: Desktop app tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/integration/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      # Each test starts the real server from server/, so it needs its dependencies.
      - name: Install the server's dependencies
        working-directory: server
        run: |
          npm --version
          npm ci

      # The tests launch the app from client/. Electron downloads its build the
      # first time it's asked where it is, not on install, so that's done here.
      - name: Install the desktop app's dependencies and Electron
        working-directory: client
        run: |
          npm ci
          node -e "console.log(require('electron'))"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright --version

      # The app's links are opened in Chromium, headless. On Linux this also
      # installs Xvfb, the virtual display the app's windows open on.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # One test at a time: in CI the app copies its links to the real clipboard,
      # which every test shares.
      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test --project=desktop --workers=1

      - name: Run tests
        if: runner.os == 'Windows'
        run: npx playwright test --project=desktop --workers=1

  # Temporary: which lookups each browser's WebRTC and background services send
  # off the machine on Linux, as the tests set them up and with each way of
  # stopping them. Removed once it has answered.
  lookups-probe:
    name: Lookups probe (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            tests/integration/package-lock.json

      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        run: |
          (cd ../../server && npm ci)
          npm ci
          npx playwright install --with-deps --only-shell chromium firefox webkit

      - name: The runner's resolver, and WebKit's options
        run: |
          echo "hosts: $(grep -E '^hosts' /etc/nsswitch.conf)"
          grep -vE '^(#|$)' /etc/resolv.conf | sed -E 's/^search .*/search (the runner'"'"'s domain)/; s/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<ip>/g'
          resolvectl status | grep -E 'Protocols|resolv.conf mode|Current Scopes|DNS Domain' | sed -E 's/DNS Domain: .*/DNS Domain: (set)/'
          W=$(ls -d ~/.cache/ms-playwright/webkit-*)
          ls "$W"
          echo "=== pw_run.sh"; cat "$W/pw_run.sh"
          echo "=== --help"; timeout 20 "$W/pw_run.sh" --headless --help 2>&1 | head -60 || true
          echo "=== --features=help (WebRTC, ICE, mDNS)"; timeout 20 "$W/pw_run.sh" --headless --features=help 2>&1 | grep -iE 'rtc|ice|mdns|usage|unknown' | head -40 || true

      - name: Probe each browser's lookups
        run: |
          cat > probe.spec.mjs <<'EOF'
          import http from 'node:http';
          import os from 'node:os';
          import { test } from '@playwright/test';
          import { startStunServer } from './helpers/stun.mjs';

          const variant = process.env.PROBE_VARIANT;
          // Playwright 1.63's own --disable-features list, with WebRTC's mDNS names added.
          const PW = 'AvoidUnnecessaryBeforeUnloadCheckSync,DestroyProfileOnBrowserClose,DialMediaRouteProvider,GlobalMediaControls,HttpsUpgrades,LensOverlay,MediaRouter,PaintHolding,ThirdPartyStoragePartitioning,BlockOriginHeaderModificationOnRedirect,Translate,AutoDeElevate,OptimizationHints,msForceBrowserSignIn,msEdgeUpdateLaunchServicesPreferredVersion';
          const options = {
              'chromium-feature': { args: [`--disable-features=${PW},WebRtcHideLocalIpsWithMdns`] },
              'firefox-off': { firefoxUserPrefs: { 'media.peerconnection.ice.obfuscate_host_addresses': false, 'extensions.systemAddon.update.enabled': false } },
              'webkit-mdns': { args: ['--features=-WebRTCMDNSICECandidatesEnabled'] },
              'webkit-filter': { args: ['--features=-ICECandidateFilteringEnabled'] },
          }[variant] ?? {};
          const contextOptions = variant === 'chromium-perms' ? { permissions: ['camera', 'microphone'] } : {};
          const own = new Set(Object.values(os.networkInterfaces()).flat().map((i) => i.address));
          const where = (a) => (a?.endsWith('.local') ? 'mDNS name' : /^(127\.|::1$)/.test(a ?? '') ? 'loopback' : own.has(a) ? 'this machine' : `other (${a ? 'hidden' : 'none'})`);
          const brief = (cs) => cs.map((c) => { const p = c.candidate.split(' '); return `${p[2]} ${p[7]} ${where(p[4])}`; }).join(', ') || 'none';

          test('probe', async ({ playwright, browserName, launchOptions }) => {
              test.setTimeout(120_000);
              const browser = await playwright[browserName].launch({ ...launchOptions, ...options, args: [...(launchOptions.args ?? []), ...(options.args ?? [])] });
              const stun = await startStunServer();
              const server = http.createServer((_q, r) => { r.setHeader('content-type', 'text/html'); r.end('<!doctype html><title>probe</title>'); });
              await new Promise((r) => server.listen(0, '127.0.0.1', r));
              try {
                  const url = `http://127.0.0.1:${server.address().port}/`;
                  const a = await (await browser.newContext(contextOptions)).newPage();
                  const b = await (await browser.newContext(contextOptions)).newPage();
                  await a.goto(url);
                  await b.goto(url);
                  const setup = (stunUrl) => {
                      window.pc = new RTCPeerConnection({ iceServers: [{ urls: stunUrl }] });
                      window.found = [];
                      window.pc.onicecandidate = (e) => { if (e.candidate?.candidate) window.found.push(e.candidate.toJSON()); };
                  };
                  await a.evaluate(setup, stun.url);
                  await b.evaluate(setup, stun.url);
                  const offer = await a.evaluate(async () => { window.dc = window.pc.createDataChannel('x'); await window.pc.setLocalDescription(); return window.pc.localDescription.toJSON(); });
                  const answer = await b.evaluate(async (o) => { await window.pc.setRemoteDescription(o); await window.pc.setLocalDescription(); return window.pc.localDescription.toJSON(); }, offer);
                  await a.evaluate(async (o) => { await window.pc.setRemoteDescription(o); }, answer);
                  await a.waitForTimeout(2000);
                  const fa = await a.evaluate(() => window.found);
                  const fb = await b.evaluate(() => window.found);
                  await b.evaluate(async (cs) => { for (const c of cs) await window.pc.addIceCandidate(c); }, fa);
                  await a.evaluate(async (cs) => { for (const c of cs) await window.pc.addIceCandidate(c); }, fb);
                  const state = await a.evaluate(() => new Promise((r) => {
                      const done = () => ['connected', 'failed'].includes(window.pc.connectionState) && r(window.pc.connectionState);
                      window.pc.onconnectionstatechange = done; done(); setTimeout(() => r(`still ${window.pc.connectionState}`), 15000);
                  }));
                  console.log(`PROBE ${variant}: ${state}; a found: ${brief(fa)}; b found: ${brief(fb)}`);
                  if (process.env.PROBE_HOLD_MS) await a.waitForTimeout(Number(process.env.PROBE_HOLD_MS));
              } finally {
                  await browser.close();
                  await stun.stop();
                  server.close();
              }
          });
          EOF
          IF=$(ip route show default | awk '{print $5; exit}')
          for v in chromium chromium-perms chromium-feature firefox firefox-off webkit webkit-mdns webkit-filter; do
            p=${v%%-*}
            hold=0; [ "$v" = firefox-off ] && hold=40000
            sudo resolvectl monitor > "$RUNNER_TEMP/$v.dns" 2>&1 & dpid=$!
            sudo tcpdump -n -l -i "$IF" 'port 53 or port 5353' > "$RUNNER_TEMP/$v.pkt" 2>/dev/null & tpid=$!
            sleep 2
            PROBE_VARIANT=$v PROBE_HOLD_MS=$hold npx playwright test probe.spec.mjs --project=$p --reporter=list > "$RUNNER_TEMP/$v.out" 2>&1 || true
            sleep 1
            sudo kill "$dpid" "$tpid" 2>/dev/null || true
            sleep 1
            echo "=================== $v"
            grep -E 'PROBE|passed|failed|Error' "$RUNNER_TEMP/$v.out" | head -8
            echo "--- names asked of the resolver (count, name):"
            grep -E 'Q: ' "$RUNNER_TEMP/$v.dns" | sed -E 's/^.*Q: //; s/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g' | sort | uniq -c | sort -rn | head -12 || true
            echo "--- packets on $IF, ports 53 and 5353: $(grep -c . "$RUNNER_TEMP/$v.pkt")"
            sed -E 's/^[0-9:.]+ //; s/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g; s/224\.0\.0\.251/MDNS4/g; s/ff02::fb/MDNS6/g; s/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<ip>/g; s/([0-9a-f]{0,4}:){2,}[0-9a-f]{0,4}/<ip6>/g; s/ [0-9]+\+? / /' "$RUNNER_TEMP/$v.pkt" | cut -c1-150 | sort | uniq -c | sort -rn | head -10
          done

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '^24.14'

      # Nothing to install: the checks have no dependencies. They read the
      # repository's Markdown and source, and never fetch a link. The TAP
      # reporter prints each check's name.
      - name: Run checks
        run: node --test --test-reporter=tap "*.test.mjs"
