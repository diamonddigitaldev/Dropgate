name: CI

on:
  push:
    branches: ['4.0.0']
  pull_request:
    branches: ['4.0.0']

permissions:
  contents: read

jobs:
  server:
    name: Server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # The expected-failure tests use node:test's expectFailure, added in 24.14.
          node-version: '^24.14'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          npm --version
          npm ci

      # The same run as `npm test`, with the TAP reporter so each expected failure's
      # label shows in the log. The reporter has to come before the pattern, which
      # `npm test -- --test-reporter=tap` can't do.
      - name: Run tests
        run: node --test --test-reporter=tap "test/*.test.mjs"

  client:
    name: Client tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # The expected-failure tests use node:test's expectFailure, added in 24.14.
          node-version: '^24.14'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      # Electron downloads its binary the first time it runs, not on install, and
      # these tests only read the source, so nothing large is downloaded here.
      - name: Install dependencies
        run: |
          npm --version
          npm ci

      # The same run as `npm test`, with the TAP reporter so each expected failure's
      # label shows in the log.
      - name: Run tests
        run: node --test --test-reporter=tap "test/*.test.mjs"

  client-build:
    name: Client build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            packages: exe
          - os: ubuntu-latest
            platform: --linux
            packages: AppImage deb rpm
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          npm --version
          npm ci

      # The .rpm target needs rpmbuild, from the rpm package. The Ubuntu image
      # ships it today, so this only installs it if a later image drops it.
      - name: Check for rpmbuild
        if: runner.os == 'Linux'
        run: |
          if ! command -v rpmbuild > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends rpm
          fi
          rpmbuild --version

      # Builds this platform's targets from the "build" config in package.json.
      # Nothing is published, and no token is passed to it.
      - name: Build the packages
        run: npx --no-install electron-builder ${{ matrix.platform }} --publish never

      - name: List the built files
        shell: bash
        run: |
          for f in dist/*; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            printf '%-45s %11d bytes  %s\n' "${f#dist/}" "$size" \
              "$(numfmt --to=iec-i --suffix=B --format=%.1f "$size")"
          done
          for ext in ${{ matrix.packages }}; do
            ls dist/*."$ext" > /dev/null || { echo "No .$ext package was built"; exit 1; }
          done

      - name: Show the .deb and .rpm metadata
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/*.deb
          rpm -qip dist/*.rpm

      # package.json leaves client/test/ out of the app. This lists what the
      # packaged app holds outside node_modules, and fails if test/ is back in.
      - name: Check the packaged app
        shell: bash
        run: |
          list=$(npx --no-install asar list dist/*-unpacked/resources/app.asar | tr '\\' '/')
          echo "app.asar holds $(printf '%s\n' "$list" | wc -l) entries. Outside node_modules:"
          printf '%s\n' "$list" | grep -v '^/node_modules/'
          if printf '%s\n' "$list" | grep -q '^/test\(/\|$\)'; then
            echo "client/test/ is in the package"
            exit 1
          fi

      # The app loads core's build from src/dropgate-core.js, which the core job
      # checks against core's source. This checks the package carries it as is.
      - name: Check the packaged app carries core's build
        shell: bash
        run: |
          node -e '
            const { extractFile } = require("@electron/asar");
            const fs = require("fs");
            const packaged = extractFile(process.argv[1], "src/dropgate-core.js");
            if (!packaged.equals(fs.readFileSync("src/dropgate-core.js"))) {
              console.error("The packaged src/dropgate-core.js is not the one in client/src.");
              process.exit(1);
            }
            console.log("The packaged app carries client/src/dropgate-core.js as it is.");
          ' dist/*-unpacked/resources/app.asar

  core:
    name: Core typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/dropgate-core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/dropgate-core/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        run: |
          npm --version
          npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The build also writes core's copies in the server and the client
      # (scripts/copy-build.mjs). If that changed anything, a copy was edited by
      # hand, or not built again after a change to core.
      - name: Check the server's and client's copies of the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "The build changed the files above. Run npm run build in packages/dropgate-core and commit them."
            exit 1
          fi
          echo "The server's and client's copies are this build."

      # The verbose reporter lists every test, so each expected failure's name,
      # which says what fixes it, shows in the log.
      - name: Run tests
        run: npx vitest run --reporter=verbose

  integration:
    name: Integration tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            tests/integration/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Each test starts the real server from server/, so it needs its dependencies.
      - name: Install the server's dependencies
        working-directory: server
        run: |
          npm --version
          npm ci

      - name: Install dependencies
        run: |
          npm ci
          npx playwright --version

      # Only the browsers the tests use, plus the system libraries they need. The
      # tests run headless, so Chromium's headless shell is enough.
      - name: Install browsers
        run: npx playwright install --with-deps --only-shell chromium firefox webkit

      # Temporary: every DNS name looked up on the runner while the tests run, to
      # see whether any browser, WebKit in particular, looks for a proxy (wpad).
      - name: Watch DNS lookups (temporary)
        run: |
          sudo resolvectl monitor > "$RUNNER_TEMP/dns.txt" 2>&1 &
          echo $! > "$RUNNER_TEMP/dns.pid"
          sleep 2
          getent ahosts github.com > /dev/null
          sleep 1
          grep -q 'github\.com' "$RUNNER_TEMP/dns.txt" && echo "The watch sees lookups." || { echo "The watch saw nothing:"; cat "$RUNNER_TEMP/dns.txt"; }

      # The list reporter prints every test's name, browser and result. Every test
      # talks only to its own server on 127.0.0.1. The desktop app's tests run in
      # their own job, below.
      - name: Run tests
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: List the DNS lookups (temporary)
        if: always()
        run: |
          sudo kill "$(cat "$RUNNER_TEMP/dns.pid")" || true
          sleep 1
          echo "Names looked up while the tests ran (count, name):"
          grep -E 'Q: '"$RUNNER_TEMP/dns.txt" | sed -E 's/^.*Q: //' | sort | uniq -c | sort -rn || true
          echo "Lines naming wpad:"
          grep -i wpad "$RUNNER_TEMP/dns.txt" || echo "none"
          echo "The first 60 lines of the watch, as written:"
          head -n 60 "$RUNNER_TEMP/dns.txt"

  desktop:
    name: Desktop app tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            tests/integration/package-lock.json

      # npm 12 is what applies the allowScripts approvals in package.json.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      # Each test starts the real server from server/, so it needs its dependencies.
      - name: Install the server's dependencies
        working-directory: server
        run: |
          npm --version
          npm ci

      # The tests launch the app from client/. Electron downloads its build the
      # first time it's asked where it is, not on install, so that's done here.
      - name: Install the desktop app's dependencies and Electron
        working-directory: client
        run: |
          npm ci
          node -e "console.log(require('electron'))"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright --version

      # The app's links are opened in Chromium, headless. On Linux this also
      # installs Xvfb, the virtual display the app's windows open on.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # One test at a time: in CI the app copies its links to the real clipboard,
      # which every test shares.
      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test --project=desktop --workers=1

      - name: Run tests
        if: runner.os == 'Windows'
        run: npx playwright test --project=desktop --workers=1

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '^24.14'

      # Nothing to install: the checks have no dependencies. They read the
      # repository's Markdown and source, and never fetch a link. The TAP
      # reporter prints each check's name.
      - name: Run checks
        run: node --test --test-reporter=tap "*.test.mjs"
