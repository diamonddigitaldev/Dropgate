services:
  dropgate-server:
    build: .
    container_name: dropgate-server
    restart: unless-stopped
    ports:
      - "52443:52443"
    environment:
      - ENABLE_UPLOAD=true
      - UPLOAD_ENABLE_E2EE=true
      - UPLOAD_MAX_FILE_SIZE_MB=100
      # Keep uploads across restarts (they're in the data volume below)
      # - UPLOAD_PRESERVE_UPLOADS=true
    volumes:
      # Everything the server keeps. Uploads are cleared at each start unless
      # UPLOAD_PRESERVE_UPLOADS=true; the server's own data always stays.
      - dropgate-data:/app/data

volumes:
  dropgate-data:
