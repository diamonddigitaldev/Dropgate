services:
  dropgate-server:
    build: .
    container_name: dropgate-server
    restart: unless-stopped
    ports:
      - "52443:52443"
    environment:
      - ENABLE_UPLOAD=true
      - UPLOAD_ENABLE_E2EE=true
      - UPLOAD_MAX_FILE_SIZE_MB=100
      # Persist uploads across restarts — requires the uploads volume below to be mapped
      # - UPLOAD_PRESERVE_UPLOADS=true
    volumes:
      # The server's own data, kept across restarts. Nothing uses it yet.
      - dropgate-data:/usr/src/app/data
      # Uncomment to persist uploads across container restarts
      # - /path/to/uploads:/usr/src/app/uploads

volumes:
  dropgate-data:
